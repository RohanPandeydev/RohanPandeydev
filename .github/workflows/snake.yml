name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RohanPandeydev
          outputs: |
            dist/snake-personal.svg
            dist/snake-personal-dark.svg?palette=github-dark

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rohanpandey-gss
          outputs: |
            dist/snake-work.svg
            dist/snake-work-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
